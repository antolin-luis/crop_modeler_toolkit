# ERA5 climate DB stack (PLANNING.md §3, §10, §13).
# Step 1 skeleton: PostGIS silver layer + Airflow (stub DAGs). Real DAG logic
# arrives in later roadmap steps.

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: airflow/Dockerfile
  # .env is the single source of config (§13); src/config.py reads CDS_KEY /
  # CDS_URL / POSTGRES_* by those names, so the whole file is passed through.
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    PYTHONPATH: /opt/airflow
    # cdsapi also honours its own env-var names; keep them in sync (§13).
    CDSAPI_URL: ${CDS_URL}
    CDSAPI_KEY: ${CDS_KEY}
    # GEE backend: the service-account key is bind-mounted (see volumes); point the
    # in-container paths at the mount, overriding the host paths .env carries for
    # host-side runs (an `environment:` value wins over `env_file`).
    GEE_SERVICE_ACCOUNT_FILE: /opt/airflow/secrets/gee-key.json
    GOOGLE_APPLICATION_CREDENTIALS: /opt/airflow/secrets/gee-key.json
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - airflow_logs:/opt/airflow/logs
    # Bronze Parquet lands here (DATA_DIR=/data → /data/bronze). On the Pi this is
    # the 2 TB SSD; locally it is the git-ignored ./.localdata dir.
    - ./.localdata:/data
    # GEE service-account key, read-only. Source is the host path from .env
    # (GEE_SERVICE_ACCOUNT_FILE); falls back to /dev/null for CDS-only users.
    - ${GEE_SERVICE_ACCOUNT_FILE:-/dev/null}:/opt/airflow/secrets/gee-key.json:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    # Multi-arch mirror of the official postgis image — the canonical
    # postgis/postgis:16-3.4 has no arm64 build, so it fails on the Pi 5 target.
    image: imresamu/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Auto-restores the grid seed on a FRESH volume only (initdb runs once).
      - ./seeds:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname admin --lastname admin \
          --role Admin --email admin@example.com || true
        # Cap simultaneous CDS requests (download_bronze binds to this pool, §10).
        airflow pools set cds_pool 2 "CDS request cap"
        # Cap simultaneous GEE export tasks (download_bronze_gee binds to this pool).
        airflow pools set gee_pool 2 "GEE export cap"
        # Cap simultaneous silver year-transforms (transform_silver binds to this pool).
        # ~220 MB per task process on the Pi target; tune slots live in Admin -> Pools.
        airflow pools set silver_pool 3 "Silver transform memory cap"
    restart: on-failure

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  airflow_logs:
